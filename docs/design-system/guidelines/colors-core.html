<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:112px;display:flex;flex-direction:column;gap:6px}.chip{height:64px}.n{font-size:12px;font-weight:500;line-height:1.3}.v{font-size:12px;color:var(--text-secondary);line-height:1.3;font-family:ui-monospace,Menlo,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ok-ink);"></div><div class="n">Ink</div><div class="v">#111111</div></div><div class="sw"><div class="chip" style="background:var(--ok-white);box-shadow:inset 0 0 0 1px var(--ok-hairline)"></div><div class="n">White / Canvas</div><div class="v">#ffffff</div></div><div class="sw"><div class="chip" style="background:var(--ok-soft-cloud);"></div><div class="n">Soft Cloud</div><div class="v">#f5f5f5</div></div></div></body></html>
