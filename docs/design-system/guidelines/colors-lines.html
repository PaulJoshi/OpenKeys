<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:112px;display:flex;flex-direction:column;gap:6px}.chip{height:64px}.n{font-size:12px;font-weight:500;line-height:1.3}.v{font-size:12px;color:var(--text-secondary);line-height:1.3;font-family:ui-monospace,Menlo,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ok-hairline);"></div><div class="n">Hairline</div><div class="v">#cacacb</div></div><div class="sw"><div class="chip" style="background:var(--ok-hairline-soft);"></div><div class="n">Hairline Soft</div><div class="v">#e5e5e5</div></div><div class="sw" style="width:220px"><div class="chip" style="background:#fff;box-shadow:var(--elevation-inset);border-top:1px solid var(--ok-hairline)"></div><div class="n">Divider + inset bottom-line</div><div class="v">--elevation-inset</div></div></div></body></html>
