<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:112px;display:flex;flex-direction:column;gap:6px}.chip{height:64px}.n{font-size:12px;font-weight:500;line-height:1.3}.v{font-size:12px;color:var(--text-secondary);line-height:1.3;font-family:ui-monospace,Menlo,monospace}</style></head><body><div style="display:flex;gap:24px;align-items:center;height:110px"><button class="ok-press" style="height:48px;padding:0 32px;border:0;border-radius:30px;background:var(--ok-ink);color:#fff;font:500 16px/1.5 var(--font-sans);cursor:pointer">Press me</button><div style="height:48px;padding:0 32px;border-radius:30px;background:var(--ok-ink);color:#fff;font:500 16px/48px var(--font-sans);transform:scale(.5);opacity:.5">Pressed</div><div class="v">200ms · cubic-bezier(0.4,0,0.2,1)<br>no hover states by policy</div></div></body></html>
