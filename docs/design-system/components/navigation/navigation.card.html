<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px 24px;background:#fff}.lbl{font:500 11px/1.4 ui-monospace,Menlo,monospace;color:var(--ok-mute)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { UtilityBar, PrimaryNav, SubNav, FilterSidebar, Footer, SearchPill, IconButton } = window.OpenKeysDesignSystem_dedd02;
const Row = ({label, children, gap=12, align='center'}) => <div style={{display:'flex',flexDirection:'column',gap:6}}><div className="lbl">{label}</div><div style={{display:'flex',gap,alignItems:align,flexWrap:'wrap'}}>{children}</div></div>;
function Demo(){ const [act,setAct]=React.useState('songs'); const [h,setH]=React.useState(false);
return <div style={{margin:'-20px -24px',zoom:0.62}}>
<UtilityBar left="Free & open-source" links={[{label:'GitHub'},{label:'Help'},{label:'Sign in'}]}/>
<PrimaryNav links={[{id:'learn',label:'Learn'},{id:'songs',label:'Songs'},{id:'practice',label:'Practice'},{id:'about',label:'About'}]} active={act} onNavigate={setAct} right={<><SearchPill placeholder="Search songs"/><IconButton icon="user" label="Profile" variant="ghost"/></>}/>
<SubNav breadcrumb={['Songs','Classical']} title="Classical (42)" filtersHidden={h} onToggleFilters={()=>setH(!h)}/>
<div style={{display:'flex',gap:48,padding:'0 48px'}}>{!h && <FilterSidebar groups={[{title:'Level',options:[{label:'Beginner',count:64,active:true},{label:'Intermediate',count:31}]},{title:'Hands',options:[{label:'Right hand',count:40},{label:'Both hands',count:55}]}]}/>}
<Footer style={{flex:1,borderTop:0,padding:'18px 0'}} columns={[{title:'Learn',links:['Lessons','Songs']},{title:'Project',links:['GitHub','Contribute']},{title:'Help',links:['FAQ','Contact']}]} legal={['© 2026 OpenKeys contributors','MIT License','Privacy']}/></div>
</div> }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
